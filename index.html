<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ork-Spickzettel</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b2124">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#e8ebe4;--sf:#fff;--sf2:#dde2d8;--tx:#1c2327;--mu:#59645c;--ac:#c4521e;--ok:#4d7a2e;--ln:#c8cfc3;--st:#2f6aa3;--mi:#8a6200;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2124;--sf:#263035;--sf2:#2f3b41;--tx:#e7eae4;--mu:#9aa79f;--ac:#e07a43;--ok:#8fb86a;--ln:#3a474e;--st:#3f7fc0;--mi:#a87a14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b2124;--sf:#263035;--sf2:#2f3b41;--tx:#e7eae4;--mu:#9aa79f;--ac:#e07a43;--ok:#8fb86a;--ln:#3a474e;--st:#3f7fc0;--mi:#a87a14;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--ln)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
.grp{display:flex;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:10px}
.grp b{font:700 20px 'Barlow Condensed',sans-serif;min-width:54px;text-align:center}
.grp small{color:var(--mu);margin-left:8px;font-size:13px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.grp button{width:38px;height:38px;font-size:20px}
.tg{padding:8px 12px;border:1px solid var(--ln);background:var(--sf);border-radius:10px;font-weight:600}
.tg[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.sp{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);font-weight:600;font-size:15px}
.tab[aria-selected=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.tab i{font-style:normal;color:var(--mu);margin-left:5px;font-weight:500}
.tab[aria-selected=true] i{color:inherit;opacity:.7}
main{padding:12px 12px 96px;max-width:640px;margin:0 auto}
.hint{color:var(--mu);font-size:14px;margin:2px 2px 10px}
.card{display:flex;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px;border-left:5px solid var(--ln)}
.card.riled{border-left-color:var(--ac)}
.card.done{opacity:.5;border-left-color:var(--ok)}
.card.done h3{text-decoration:line-through}
.chk{flex:0 0 34px;height:34px;border:2px solid var(--mu);border-radius:9px;display:grid;place-items:center;font-size:20px;color:transparent}
.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.passive .chk{display:none}
.body{flex:1;min-width:0}
h3{margin:0;font:700 20px/1.15 'Barlow Condensed',sans-serif}
.meta{color:var(--mu);font-size:14px;margin:2px 0 6px}
.meta em{font-style:normal;color:var(--ac);font-weight:600}
.txt{font-size:15.5px}
.txt.cl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{color:var(--mu);font-size:13px;margin-top:4px;padding:2px 0}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--tx);width:min(92vw,420px);padding:16px}
dialog::backdrop{background:#0008}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;margin-top:14px}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--ln);font-weight:600;background:var(--sf2)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.fab{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;display:flex;gap:8px}
.fab .btn{flex:1;font-size:17px;padding:13px;box-shadow:0 2px 10px #0004}
.fab .btn.p{flex:2}
.kind{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 8px;border-radius:999px;margin-right:6px;border:1px solid var(--ln);color:var(--mu)}
.kind.s{background:var(--st);border-color:var(--st);color:#fff}
.sec{margin:14px 2px 8px;font:700 17px 'Barlow Condensed',sans-serif;color:var(--mu)}
.sec:first-child{margin-top:2px}
.card.s{border-left-color:var(--st)}
.card.s.riled{border-left-color:var(--ac)}
.cm{padding:9px 11px;gap:10px;margin-bottom:7px}
.cm .chk{flex-basis:28px;height:28px;font-size:16px}
.cm h3{font-size:18px}.cm .meta{margin:1px 0 3px}
.sh{font-size:15px}.cm .txt{margin-top:6px;padding-top:6px;border-top:1px dashed var(--ln)}
.now{box-shadow:0 0 0 2px var(--ac)}
.ua{background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:10px}
.uh{display:flex;width:100%;align-items:baseline;gap:10px;padding:12px;text-align:left}
.uh h3{flex:1}.uh .pt{color:var(--mu);font-size:14px}
.ub{padding:0 10px 6px}
.stat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:2px 0 8px;text-align:center}
.stat div{background:var(--sf2);border-radius:8px;padding:3px 0}
.stat b{display:block;font:700 18px 'Barlow Condensed',sans-serif}.stat span{font-size:12px;color:var(--mu)}
.wp{font-size:14.5px;border-top:1px solid var(--ln);padding:6px 0}
.wp small{display:block;color:var(--mu);font-size:13.5px}
.sub{font:700 16px 'Barlow Condensed',sans-serif;color:var(--mu);margin:10px 0 6px}
.vw{padding:8px 10px;border:1px solid var(--ln);background:var(--sf);border-radius:10px;font-weight:600;width:auto}
.wsec{margin:6px 0 10px;border-left:4px solid var(--st);padding-left:10px}
.wsec.ml{border-left-color:var(--ac)}
.wsh{font:700 17px 'Barlow Condensed',sans-serif;color:var(--st)}.ml .wsh{color:var(--ac)}
.wg{padding:8px 0 6px;border-top:1px solid var(--ln)}.wsh+.wg{border-top:0}
.wn{font:700 20px/1.15 'Barlow Condensed',sans-serif}
.wr{margin-top:5px}.wr.m{margin-left:4px;padding-left:8px;border-left:2px solid var(--ln)}
.wm{font-weight:600;font-size:15px;margin-bottom:3px}
.ws{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
.ws div{background:var(--sf2);border-radius:8px;padding:2px 0 3px;min-width:0}
.ws span{display:block;font-size:12px;color:var(--mu)}
.ws b{display:block;font:700 20px/1.1 'Barlow Condensed',sans-serif;color:var(--tx)}
.ws b.sm{font-size:15px;line-height:1.45}
.kw{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.kw span{font-size:13px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--sf2);color:var(--tx)}
.gl{text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.kw .kc{font:600 13px Barlow,system-ui,sans-serif;padding:1px 8px;border-radius:999px;background:var(--sf2);color:var(--tx);border:0;text-decoration:underline dotted;text-underline-offset:3px}
#dg{padding:0}.dgi{padding:16px}
#dg h3{margin:0 0 4px;font:700 24px 'Barlow Condensed',sans-serif}
#dg .txt{font-size:16px;max-height:55vh;overflow-y:auto}
.kind.m{background:var(--mi);border-color:var(--mi);color:#fff}
.card.mi{border-left-color:var(--mi)}
#msn{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dm{width:min(94vw,560px);padding:0}
#dmb{max-height:66vh;overflow-y:auto}
#dmb h3{margin:14px 0 4px;font:700 24px 'Barlow Condensed',sans-serif}
.dcs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.dc{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--ln);background:var(--sf2);font-weight:600;font-size:14px}
.dc i{width:12px;height:12px;border-radius:50%;display:inline-block}
.dc.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.mr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-top:1px solid var(--ln)}
.mw{grid-column:1/-1;font-size:12.5px;color:var(--mu)}
.mt{font-size:15px}.mv{font:700 21px 'Barlow Condensed',sans-serif;color:var(--mi);align-self:center}
.key{border-left:4px solid var(--mi);background:var(--sf2);padding:8px 10px;border-radius:8px;font-weight:600;margin:12px 0 4px}
.tp{margin:12px 0 4px;border-top:1px solid var(--ln);padding-top:8px}
.tp summary{font:700 17px 'Barlow Condensed',sans-serif;color:var(--mi);cursor:pointer;padding:4px 0}
.tp ul{margin:4px 0 0 18px;padding:0}.tp li{margin:6px 0;font-size:15px}
.pl{min-width:0}
@media (min-width:700px){
main{max-width:1240px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.pr{position:sticky;top:calc(var(--hh,150px) + 10px);max-height:calc(100vh - var(--hh,150px) - 30px);overflow-y:auto;min-width:0}
.fab{left:12px;right:calc(50% + 9px);max-width:none;margin:0}
}
.x{margin-left:auto;color:var(--mu);font-size:13px;padding:2px 6px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style></head><body>
<header>
 <div class="bar">
  <div class="grp"><button id="rm" aria-label="Runde zurück">−</button><b id="rv"></b><button id="rp" aria-label="Runde vor">+</button></div>
  <div class="grp"><button id="cm" aria-label="CP minus">−</button><b id="cv"></b><small>CP</small><button id="cp" aria-label="CP plus">+</button></div>
  <button class="tg" id="rl" aria-pressed="false">Riled up</button>
  <div class="sp"></div>
  <button class="tg" id="msn">Mission</button>
  <button class="tg" id="gear" aria-label="Regeldaten">⚙</button>
  <select class="vw" id="vw" aria-label="Ansicht"><option value="detail">Detailliert</option><option value="compact">Kompakt</option><option value="units">Einheiten</option></select>
  <button class="tg" id="tn" aria-pressed="false"></button>
 </div>
 <div class="tabs" id="tabs" role="tablist"></div>
</header>
<main id="main"></main>
<div class="fab"><button class="btn" id="add">+ Eigene</button><button class="btn p" id="nx"></button></div>
<dialog id="dg"><div class="dgi"><h3 id="dgt"></h3><div class="hint" id="dgp"></div><div class="txt" id="dgd"></div></div></dialog>
<dialog id="dm"><div class="dgi"><div id="dmb"></div><div class="row"><button class="btn p" id="dmc">Fertig</button></div></div></dialog>
<dialog id="dd"><h3 style="margin:0 0 8px;font:700 22px 'Barlow Condensed',sans-serif">Regeldaten</h3>
 <p id="dinfo" class="hint"></p>
 <label class="btn" for="imp2" style="display:block;text-align:center;margin:0">Datei importieren</label><input type="file" id="imp2" accept=".json,application/json" hidden>
 <div class="row"><button class="btn" id="dres">Spielstand zurücksetzen</button><button class="btn" id="ddel">Daten löschen</button></div>
 <div class="row"><button class="btn p" id="dcl">Schließen</button></div></dialog>
<dialog id="dlg"><form method="dialog" id="f">
 <h3>Eigene Erinnerung</h3>
 <label for="fn">Name (z. B. Stratagem)</label><input id="fn" required>
 <label for="fp">Wann</label><select id="fp"></select>
 <label for="fk">Art</label><select id="fk"><option value="stratagem">Stratagem</option><option value="ability">Ability</option></select>
 <label for="fc">CP-Kosten (nur Stratagem, optional)</label><input id="fc" type="number" min="0" max="9" inputmode="numeric">
 <label for="ft">Regeltext (optional)</label><textarea id="ft" rows="3"></textarea>
 <div class="row"><button class="btn" value="x">Abbrechen</button><button class="btn p" id="fs" value="ok">Speichern</button></div>
</form></dialog>
<script>
const EMBED=false;let ITEMS=[],UNITS=[],GLOSS={},MISS={},TIPS={};
const DKEY='ork40k-data-v1';
(function(){try{const r=localStorage.getItem(DKEY);if(r){const d=JSON.parse(r);if(Array.isArray(d.ITEMS)&&Array.isArray(d.UNITS)){ITEMS=d.ITEMS;UNITS=d.UNITS;GLOSS=d.GLOSS||{};MISS=d.MISS||{};TIPS=d.TIPS||{}}}}catch(e){}})();
const PH=[["round","Rundenbeginn"],["command","Command"],["movement","Movement"],["shooting","Shooting"],["charge","Charge"],["fight","Fight"],["end","Zugende"],["passive","Passiv"]];
const KEY="ork40k-v1";
let S={view:"detail",uo:null,dispMe:"purge",dispOpp:"",mview:"me",round:1,cp:0,riled:false,opp:false,phase:"round",done:{},open:{},custom:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let GN=null;
const q=s=>String(s).replace(/"/g,"&quot;");
function gkey(x){
  if(!GLOSS||!x)return null;if(!GN)GN=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
  const s=String(x).replace(/[\[\]*]/g,"").trim().toLowerCase().split(":")[0].trim();
  for(const n of GN){if(s===n||(s.startsWith(n)&&/^[\s\-\d+"x]/.test(s.slice(n.length))))return n}
  return null}
const gt=n=>gkey(n)?`<span class="gl" data-g="${q(esc(n))}">${esc(n)}</span>`:esc(n);
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>").replace(/&lt;ins&gt;(.+?)&lt;\/ins&gt;/g,"$1").replace(/\n/g,"<br>").replace(/<(b|i)>(.*?)<\/\1>/g,(m,tg,inn)=>{const pl=inn.replace(/<[^>]+>/g,"");return gkey(pl)?`<${tg}><span class="gl" data-g="${q(pl)}">${inn}</span></${tg}>`:m});
function showGloss(term){
  const k=gkey(term);if(!k)return;const e=GLOSS[k];
  $("dgt").textContent=e.n;
  const clean=String(term).replace(/[\[\]*]/g,"").trim();
  $("dgp").textContent=(clean.toLowerCase()!==e.n.toLowerCase()?"Hier: "+clean+" · ":"")+(e.p?"Regelbuch S. "+e.p:"Regelbuch");
  $("dgd").innerHTML=fmt(e.d).replace(/\*/g,"");
  $("dg").showModal()}
const all=()=>ITEMS.concat(mi(),S.custom);
function phOf(i){const p=i.phases;return p&&p.length?p:["passive"]}
function inPhase(i,ph){
  const p=phOf(i);
  if(i.r&&(S.round<i.r[0]||S.round>i.r[1]))return false;
  if(ph==="passive")return p[0]==="passive";
  if(!p.includes(ph))return false;
  if(ph==="round")return true;
  const o=(i.oppMap&&ph in i.oppMap)?i.oppMap[ph]:i.opp;
  return o==="both"||!!o===S.opp;
}
function card(i,pas){
  const d=!!S.done[i.id],ex=!!S.open[i.id],s=i.kind==="stratagem";
  const rl=S.riled&&i.riled?" riled":"";
  const once=i.once==="battle"?"einmal pro Spiel":i.once==="round"?"einmal pro Runde":i.once==="phase"?"einmal pro Phase":"";
  const kd=kindChip(i);
  return `<article class="card${kc(i)}${d?" done":""}${rl}${pas?" passive":""}" data-id="${i.id}"><div class="chk" data-a="t">✓</div><div class="body"><h3>${gt(i.name)}</h3><div class="meta">${kd}${esc(i.unit)}${s&&S.phase!=="passive"?` · <em>${turnTxt(i)}</em>`:""}${once?` · <em>${once}</em>`:""}${i.custom?` <button class="x" data-a="del">Löschen</button>`:""}</div>${i.text?`<div class="txt${ex?"":" cl"}" data-a="o">${fmt(i.text)}</div>${!ex&&i.text.length>150?`<div class="more" data-a="o">mehr</div>`:""}`:""}</div></article>`}
const PL=Object.fromEntries(PH);
function turnTxt(i){const o=(i.oppMap&&S.phase in i.oppMap)?i.oppMap[S.phase]:i.opp;return o===true?"Gegnerzug":o==="both"?"beide Züge":"Mein Zug"}
function phTxt(i){const p=phOf(i);if(p[0]==="passive")return "Passiv";return p.map(x=>PL[x]).join("/")+(i.opp===true?" · Gegnerzug":(i.opp==="both"||i.oppMap)?" · auch Gegnerzug":"")}
function cardC(i,pas,inUnit){
  const d=!!S.done[i.id],ex=!!S.open[i.id],s=i.kind==="stratagem",pv=phOf(i)[0]==="passive";
  const now=inUnit&&!pv&&inPhase(i,S.phase)?" now":"";
  const rl=S.riled&&i.riled?" riled":"";
  const kd=kindChip(i);
  const once=i.once==="battle"?" · <em>1×/Spiel</em>":i.once==="round"?" · <em>1×/Runde</em>":"";
  const sh=i.short||(i.text||"").replace(/\*/g,"").slice(0,70);
  return `<article class="card cm${kc(i)}${d?" done":""}${rl}${now}${pv?" passive":""}" data-id="${i.id}"><div class="chk" data-a="t">✓</div><div class="body" data-a="o"><h3>${gt(i.name)}</h3><div class="meta">${kd}${inUnit?esc(phTxt(i)):esc(i.unit)}${s&&!inUnit&&S.phase!=="passive"?` · <em>${turnTxt(i)}</em>`:""}${once}${i.custom?` <button class="x" data-a="del">Löschen</button>`:""}</div><div class="sh">${esc(sh)}</div>${ex&&i.text?`<div class="txt">${fmt(i.text)}</div>`:""}</div></article>`}
function isWide(){return window.innerWidth>=700}
let MC={k:"",v:[]};
const DN={take:"Take and Hold",disr:"Disruption",purge:"Purge the Foe",prio:"Priority Assets",recon:"Reconnaissance"};
const DC={take:"#2f8a3a",disr:"#2a6fb0",purge:"#b3261e",prio:"#b58a2a",recon:"#1f8a78"};
function mi(){const k=S.dispMe+"|"+S.dispOpp;if(MC.k!==k){MC={k,v:buildMission(k)}}return MC.v}
function buildMission(k){
  const m=typeof MISS!=="undefined"&&MISS[k];if(!m)return[];const out=[];let n=0;
  const add=(r,ph,rr,opp,sx)=>out.push({id:"m"+(n++),name:r.t+(sx||""),unit:"Mission: "+m.n,text:r.x,short:r.s||"",kind:"mission",vp:r.vp,f:r.f,phases:[ph],opp,once:"p",r:rr,riled:false});
  m.rows.forEach(r=>{const a=r.r[0],b=r.r[1];
    if(r.w==="e")add(r,"end",r.r,false);
    else if(r.w==="c")add(r,"command",r.r,false);
    else if(r.w==="c5"){const hi=Math.min(b,4);if(a<=hi)add(r,"command",[a,hi],false);if(b>=5)add(r,"end",[5,5],false," (end of turn, R5)")}
    else if(r.w==="eb")add(r,"end",[5,5],"both"," (end of the battle)");
    else if(r.w==="ea")add(r,"end",r.r,"both");
    else if(r.w==="ts")add(r,"command",r.r,false," (start of turn)");
    else if(r.w==="sb")add(r,"round",r.r,false);
    else if(r.w==="m")add(r,"movement",r.r,false)});
  if(m.act)add({t:"Action: "+m.act.n,x:m.act.x,vp:"",f:"act",s:m.act.s},"shooting",m.act.r,false);
  const tp=typeof TIPS!=="undefined"&&TIPS[k];
  if(tp)out.push({id:"mt",name:"Matchup tip",unit:"Mission: "+m.n,text:tp.k+"\n\nYour plan:\n"+tp.p.map(x=>"• "+x).join("\n")+"\n\nWatch for:\n"+tp.w.map(x=>"• "+x).join("\n"),short:tp.k,kind:"mission",vp:"",f:"tip",phases:["round"],opp:false,once:"p",r:[1,5],riled:false});
  return out}
function kindChip(i){
  if(i.kind==="stratagem")return `<span class="kind s">Stratagem${i.cp!==""&&i.cp!=null?" · "+i.cp+" CP":""}</span>`;
  if(i.kind==="mission"){if(i.f==="act")return `<span class="kind m">Mission · Action</span>`;if(i.f==="tip")return `<span class="kind m">Mission · Tip</span>`;const v=String(i.vp||"");return `<span class="kind m">Mission${v?" · "+v+"VP"+(v[0]==="+"?" cumulative":""):" · Rule"}${i.f==="or"?" · or":""}</span>`}
  return `<span class="kind">Ability</span>`}

const RLN={"1-5":"Any battle round","1-1":"First battle round","1-2":"First and second battle round","2-5":"Second battle round onwards","2-4":"Second to fourth battle round","2-3":"Second and third battle round","4-5":"Fourth battle round onwards","5-5":"Fifth battle round"};

function setDisp(v){const [w,k]=v.split(":");if(w==="me")S.dispMe=k;else S.dispOpp=k;Object.keys(S.done).forEach(x=>{if(String(x)[0]==="m")delete S.done[x]});MC.k="";render();mDlg()}
function cd(i,pas){return (S.view==="compact"||(S.view==="units"&&isWide()))?cardC(i,pas,false):card(i,pas)}
function wParse(w){const m=w.name.match(/^(?:➤\s*)?(.*?)\s*-\s+(.+)$/);return m?{base:m[1].trim(),mode:m[2].trim()}:{base:w.name.replace(/^➤\s*/,""),mode:""}}

function weaponsHtml(u){

function unitHtml(u){

function unitView(){

function render(){

  {const m=typeof MISS!=="undefined"&&MISS[S.dispMe+"|"+S.dispOpp];$("msn").textContent=m?m.n:"Mission";$("msn").setAttribute("aria-pressed",!m)}
  const tb=$("tabs"),keep=tb.scrollLeft||0;tb.innerHTML=PH.map(([k,l])=>{const n=all().filter(i=>inPhase(i,k)&&!S.done[i.id]&&k!=="passive").length;return `<button class="tab" role="tab" data-p="${k}" aria-selected="${S.phase===k}">${l}${n?`<i>${n}</i>`:""}</button>`}).join("");
  try{tb.scrollLeft=keep;const sel=tb.querySelector('[aria-selected="true"]');if(sel){const tr=tb.getBoundingClientRect(),sr=sel.getBoundingClientRect();const to=Math.max(0,Math.min(tb.scrollWidth-tb.clientWidth,sr.left-tr.left+tb.scrollLeft-(tb.clientWidth-sr.width)/2));tb.scrollTo({left:to,behavior:"smooth"})}}catch(e){}

function phaseHtml(){

function seq(){const a=[["round",false]],P=["command","movement","shooting","charge","fight","end"];P.forEach(p=>a.push([p,false]));P.forEach(p=>a.push([p,true]));return a}

document.addEventListener("click",e=>{

$("rm").onclick=()=>{S.round=Math.max(1,S.round-1);render()};

function prev(){const s=seq(),i=pos();if(i<=0)return;const [p,o]=s[i-1];S.phase=p;if(p!=="round")S.opp=o;window.scrollTo(0,0);render()}
let tx=0,ty=0,tt=0,sw=false;
document.addEventListener("touchstart",e=>{const q=e.touches[0];tx=q.clientX;ty=q.clientY;tt=Date.now();sw=e.touches.length===1&&!e.target.closest(".tabs,dialog,select,input,textarea,.pr")&&tx>24&&tx<window.innerWidth-24},{passive:true});
